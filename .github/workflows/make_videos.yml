name: Video Generator (Open Model)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '视频描述'
        required: true
        type: string
        default: 'a cat playing with a ball'
      negative_prompt:
        description: '负面提示词'
        required: false
        type: string
        default: 'low quality, blurry'
      num_frames:
        description: '帧数'
        required: false
        type: string
        default: '49'
      resolution:
        description: '分辨率'
        required: false
        type: string
        default: '256x256'
      seed:
        description: '随机种子'
        required: false
        type: string
        default: '42'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate sentencepiece opencv-python imageio imageio-ffmpeg
          pip install modelscope av
      
      - name: Generate video
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          NEG_PROMPT: ${{ github.event.inputs.negative_prompt }}
          FRAMES: ${{ github.event.inputs.num_frames }}
          RES: ${{ github.event.inputs.resolution }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          python3 << 'EOF'
          import os
          import torch
          from diffusers import DiffusionPipeline, DPMSolverMultistepScheduler
          from diffusers.utils import export_to_video
          from datetime import datetime
          
          res = os.environ['RES']
          w, h = map(int, res.split('x'))
          
          print(f"Generating video with prompt: {os.environ['PROMPT']}")
          print(f"Resolution: {w}x{h}")
          print(f"Frames: {os.environ['FRAMES']}")
          
          # 使用 Modelscope 的公开模型
          pipe = DiffusionPipeline.from_pretrained(
              "damo-vilab/text-to-video-ms-1.7b",
              torch_dtype=torch.float32
          )
          pipe.scheduler = DPMSolverMultistepScheduler.from_config(pipe.scheduler.config)
          pipe.to("cpu")
          pipe.enable_model_cpu_offload()
          
          video_frames = pipe(
              prompt=os.environ['PROMPT'],
              negative_prompt=os.environ['NEG_PROMPT'],
              num_frames=int(os.environ['FRAMES']),
              height=h,
              width=w,
              num_inference_steps=25,
              guidance_scale=9.0,
              generator=torch.Generator("cpu").manual_seed(int(os.environ['SEED']))
          ).frames[0]
          
          path = f"output_{datetime.now().strftime('%Y%m%d_%H%M%S')}.mp4"
          export_to_video(video_frames, path, fps=8)
          print(f"✅ Saved: {path}")
          EOF
      
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output_*.mp4