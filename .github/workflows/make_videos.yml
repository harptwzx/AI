# .github/workflows/hunyuan_video_generator.yml
name: HunyuanVideo Generator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '视频描述'
        required: true
        type: string
      negative_prompt:
        description: '负面提示词'
        required: false
        type: string
        default: 'low quality, blurry'
      num_frames:
        description: '帧数(25/49/73/97)'
        required: false
        type: string
        default: '49'
      resolution:
        description: '分辨率(720x480/640x360/480x320)'
        required: false
        type: string
        default: '720x480'
      seed:
        description: '随机种子'
        required: false
        type: string
        default: '42'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate sentencepiece protobuf opencv-python imageio imageio-ffmpeg
      
      - name: Generate
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          NEG_PROMPT: ${{ github.event.inputs.negative_prompt }}
          FRAMES: ${{ github.event.inputs.num_frames }}
          RES: ${{ github.event.inputs.resolution }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          IFS='x' read -r W H <<< "$RES"
          python3 << 'EOF'
          import os, torch
          from diffusers import HunyuanVideoPipeline, DDIMScheduler
          from diffusers.utils import export_to_video
          from datetime import datetime
          
          w = int(os.environ['W'])
          h = int(os.environ['H'])
          
          pipe = HunyuanVideoPipeline.from_pretrained(
              "Tencent-Hunyuan/HunyuanVideo-1.5",
              scheduler=DDIMScheduler.from_pretrained("Tencent-Hunyuan/HunyuanVideo-1.5", subfolder="scheduler"),
              torch_dtype=torch.float32
          )
          pipe.to("cpu")
          pipe.enable_model_cpu_offload()
          
          frames = pipe(
              prompt=os.environ['PROMPT'],
              negative_prompt=os.environ['NEG_PROMPT'],
              num_frames=int(os.environ['FRAMES']),
              width=w,
              height=h,
              num_inference_steps=20,
              guidance_scale=6.0,
              generator=torch.Generator("cpu").manual_seed(int(os.environ['SEED']))
          ).frames[0]
          
          path = f"output_{datetime.now().strftime('%Y%m%d_%H%M%S')}.mp4"
          export_to_video(frames, path, fps=24)
          print(f"Saved: {path}")
          EOF
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output_*.mp4