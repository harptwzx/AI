name: Deploy Image Generation AI (CPU)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '图片描述（Prompt）'
        required: true
        default: 'a cute cat sitting on a chair'
        type: string
      steps:
        description: '推理步数'
        required: false
        default: '20'
        type: choice
        options:
          - '10'
          - '20'
          - '30'
          - '50'
      format:
        description: '图片格式'
        required: false
        default: 'png'
        type: choice
        options:
          - 'png'
          - 'jpg'
          - 'jpeg'
      generator:
        description: 'AI 生成器'
        required: false
        default: 'stable_diffusion'
        type: choice
        options:
          - 'stable_diffusion'
          # 后续可以添加更多: 'dalle', 'midjourney' 等

jobs:
  generate-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libpng-dev

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate pillow

      - name: 生成图片
        run: |
          cd Draw_images
          python main.py \
            --prompt "${{ github.event.inputs.prompt }}" \
            --steps ${{ github.event.inputs.steps }} \
            --format ${{ github.event.inputs.format }} \
            --generator ${{ github.event.inputs.generator }} \
            --output-json
        env:
          PYTHONPATH: .

      - name: 提交图片到 GitHub 仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 暂存更改
          git stash push -m "临时暂存" || true
          
          # 拉取远程更新
          git pull --rebase origin main || git pull --rebase origin master || true
          
          # 恢复更改
          git stash pop || true
          
          # 添加并提交
          git add generated_images/
          
          if ! git diff --staged --quiet; then
            git commit -m "🎨 添加生成的图片 [skip actions]"
            git push origin main || git push origin master
            echo "✅ 图片已推送"
          else
            echo "没有新图片"
          fi

      - name: 添加到 Job Summary
        run: |
          if [ -f generated_images/latest_info.txt ]; then
            echo "## 🎨 生成的图片" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat generated_images/latest_info.txt >> $GITHUB_STEP_SUMMARY
          fi