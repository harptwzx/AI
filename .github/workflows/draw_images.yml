name: Deploy Image Generation AI (CPU)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '图片描述'
        required: true
        default: 'a cute cat sitting on a chair'
        type: string
      steps:
        description: '推理步数'
        required: false
        default: '20'
        type: choice
        options:
          - '10'
          - '20'
          - '30'
          - '50'
      format:
        description: '图片格式'
        required: false
        default: 'png'
        type: choice
        options:
          - 'png'
          - 'jpg'
      size:
        description: '图片尺寸（超过512x512会先小图生成再放大）'
        required: false
        default: '512x512'
        type: choice
        options:
          - '512x512'
          - '768x768'
          - '1024x768'

jobs:
  generate-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libpng-dev

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate pillow

      - name: 生成图片
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          STEPS: ${{ github.event.inputs.steps }}
          FORMAT: ${{ github.event.inputs.format }}
          SIZE: ${{ github.event.inputs.size }}
        run: |
          python << 'PYTHON'
          import torch
          from diffusers import StableDiffusionPipeline, DDIMScheduler
          from PIL import Image
          import os
          from datetime import datetime
          import re

          prompt = os.environ.get('PROMPT', 'a cute cat')
          steps = int(os.environ.get('STEPS', '20'))
          img_format = os.environ.get('FORMAT', 'png').lower()
          size_str = os.environ.get('SIZE', '512x512')
          target_width, target_height = map(int, size_str.split('x'))

          safe_prompt = re.sub(r'[^a-zA-Z0-9\u4e00-\u9fff]', '_', prompt)[:50]
          timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
          ext = 'jpg' if img_format in ['jpg', 'jpeg'] else 'png'
          save_format = 'JPEG' if ext == 'jpg' else 'PNG'

          filename = f"generated_images/{timestamp}_{safe_prompt}.{ext}"
          os.makedirs("generated_images", exist_ok=True)

          model_id = "CompVis/stable-diffusion-v1-4"
          print(f"📦 加载模型...")

          pipe = StableDiffusionPipeline.from_pretrained(
              model_id,
              torch_dtype=torch.float32,
              safety_checker=None
          )
          pipe = pipe.to("cpu")
          pipe.scheduler = DDIMScheduler.from_config(pipe.scheduler.config)

          # 判断是否需要放大
          max_native = 512
          if target_width <= max_native and target_height <= max_native:
              print(f"🎨 直接生成 {target_width}x{target_height} (步数: {steps})...")
              image = pipe(prompt, num_inference_steps=steps, height=target_height, width=target_width).images[0]
          else:
              print(f"🎨 先生成 512x512，再放大到 {target_width}x{target_height}...")
              # 先生成 512x512
              base_image = pipe(prompt, num_inference_steps=steps, height=512, width=512).images[0]
              # 使用高质量 LANCZOS 算法放大
              scale_w = target_width / 512
              scale_h = target_height / 512
              new_size = (target_width, target_height)
              image = base_image.resize(new_size, Image.Resampling.LANCZOS)
              print(f"📐 已放大 (缩放比: {scale_w:.1f}x{scale_h:.1f})")

          if save_format == 'JPEG' and image.mode != 'RGB':
              image = image.convert('RGB')
          image.save(filename, format=save_format, quality=95)

          print(f"✅ 已保存: {filename} ({target_width}x{target_height})")

          with open('generated_images/latest_info.txt', 'w') as f:
              f.write(f"Filename: {filename}\nPrompt: {prompt}\nSteps: {steps}\nFormat: {img_format}\nSize: {target_width}x{target_height}\nTimestamp: {timestamp}\n")
          PYTHON

      - name: 提交到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash push -m "temp" || true
          git pull --rebase origin main || git pull --rebase origin master || true
          git stash pop || true
          git add generated_images/
          if ! git diff --staged --quiet; then
            git commit -m "🎨 生成图片 [skip actions]"
            git push origin main || git push origin master
            echo "✅ 已推送到仓库"
          else
            echo "无新图片需要提交"
          fi

      - name: 输出结果
        run: |
          python << 'EOF'
          import os
          info_file = 'generated_images/latest_info.txt'
          if os.path.exists(info_file):
              with open(info_file, 'r') as f:
                  info = f.read()
              lines = dict(line.split(': ', 1) for line in info.strip().split('\n') if ': ' in line)
              
              repo = os.environ.get('GITHUB_REPOSITORY', '')
              raw_url = f"https://raw.githubusercontent.com/{repo}/main/{lines.get('Filename', '')}"
              
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f"## 🎨 生成的图片\n\n")
                  summary.write(f"**提示词:** {lines.get('Prompt', '')}\n\n")
                  summary.write(f"**步数:** {lines.get('Steps', '')} | **尺寸:** {lines.get('Size', '')}\n\n")
                  summary.write(f'<img src="{raw_url}" width="400" alt="Generated Image">\n\n')
                  summary.write(f"[查看原图]({raw_url})\n")
          EOF