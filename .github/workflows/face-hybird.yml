name: Face Hybrid Generator

on:
  workflow_dispatch:
    inputs:
      num_sources:
        description: '采集源图片数量'
        required: true
        default: '20'
      num_hybrids:
        description: '生成杂交人脸数量'
        required: true
        default: '10'
      hybrid_generations:
        description: '杂交代数'
        required: true
        default: '3'
      mutation_rate:
        description: '变异率'
        required: true
        default: '0.1'
      face_source:
        description: '人脸来源'
        required: true
        default: 'random'

jobs:
  hybridize-faces:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
          pip install opencv-python-headless numpy pillow requests scipy tqdm selenium webdriver-manager

      - name: 运行人脸杂交
        run: |
          python face_hybird/main.py \
            --num-sources ${{ github.event.inputs.num_sources }} \
            --num-hybrids ${{ github.event.inputs.num_hybrids }} \
            --generations ${{ github.event.inputs.hybrid_generations }} \
            --mutation-rate ${{ github.event.inputs.mutation_rate }}

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hybrid_results/ extracted_faces/ source_images/
          git diff --staged --quiet || git commit -m "添加杂交人脸"
          git push