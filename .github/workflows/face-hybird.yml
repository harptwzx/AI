name: Face Hybrid Generator

on:
  workflow_dispatch:
    inputs:
      num_sources:
        description: '采集源图片数量'
        required: true
        default: '50'
      num_hybrids:
        description: '生成杂交人脸数量'
        required: true
        default: '10'
      hybrid_generations:
        description: '杂交代数'
        required: true
        default: '3'
      mutation_rate:
        description: '变异率'
        required: true
        default: '0.1'

jobs:
  hybridize-faces:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
          pip install opencv-python-headless numpy pillow requests scipy

      - name: 运行人脸杂交
        run: |
          python face_hybird/main.py \
            --num-sources ${{ github.event.inputs.num_sources }} \
            --num-hybrids ${{ github.event.inputs.num_hybrids }} \
            --generations ${{ github.event.inputs.hybrid_generations }} \
            --mutation-rate ${{ github.event.inputs.mutation_rate }}

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 只添加存在的目录
          for dir in hybrid_results extracted_faces source_images; do
            if [ -d "$dir" ]; then
              git add "$dir/"
              echo "已添加 $dir"
            fi
          done
          
          # 检查并提交
          if git diff --staged --quiet; then
            echo "没有新文件需要提交"
          else
            git commit -m "添加杂交人脸"
            git push
            echo "已提交并推送"
          fi