name: Face Hybrid Generator

on:
  workflow_dispatch:
    inputs:
      num_sources:
        description: '采集源图片数量'
        required: true
        default: '20'
      num_hybrids:
        description: '生成杂交人脸数量'
        required: true
        default: '10'
      hybrid_generations:
        description: '杂交代数'
        required: true
        default: '3'
      mutation_rate:
        description: '变异率'
        required: true
        default: '0.1'
      face_source:
        description: '人脸来源 (celebrities/random_people/anime/diverse)'
        required: true
        default: 'celebrities'

jobs:
  hybridize-faces:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 查看目录结构
        run: |
          echo "当前目录:"
          pwd
          echo ""
          echo "根目录内容:"
          ls -la
          echo ""
          echo "查找 face_hybrid:"
          find . -name "face_hybrid" -type d 2>/dev/null || echo "未找到"
          echo ""
          echo "查找 main.py:"
          find . -name "main.py" 2>/dev/null || echo "未找到"

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
          pip install opencv-python-headless numpy pillow requests scipy tqdm

      - name: 运行人脸杂交
        run: |
          # 尝试多个可能的路径
          if [ -f "face_hybrid/main.py" ]; then
            python face_hybrid/main.py \
              --num-sources ${{ github.event.inputs.num_sources }} \
              --num-hybrids ${{ github.event.inputs.num_hybrids }} \
              --generations ${{ github.event.inputs.hybrid_generations }} \
              --mutation-rate ${{ github.event.inputs.mutation_rate }} \
              --source-type ${{ github.event.inputs.face_source }}
          elif [ -f "AI/face_hybrid/main.py" ]; then
            python AI/face_hybrid/main.py \
              --num-sources ${{ github.event.inputs.num_sources }} \
              --num-hybrids ${{ github.event.inputs.num_hybrids }} \
              --generations ${{ github.event.inputs.hybrid_generations }} \
              --mutation-rate ${{ github.event.inputs.mutation_rate }} \
              --source-type ${{ github.event.inputs.face_source }}
          else
            echo "错误: 找不到 face_hybrid/main.py"
            echo "当前目录内容:"
            ls -la
            exit 1
          fi

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hybrid_results/ extracted_faces/ source_images/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "添加杂交人脸"
          git push